[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skull_reconstruction_unet"
version = "0.0.1"
description = "UNet-based skull reconstruction and image painting models (research)"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["Unet_Architecture*"]
